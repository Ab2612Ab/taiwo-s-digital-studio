name: Portfolio verification

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format and auto-fix safe lint issues
        run: |
          npx prettier --write src scripts
          npx eslint . --fix

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit source repairs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git fetch origin main
          git rebase origin/main
          git add src scripts
          git commit -m 'Apply verified source formatting and lint fixes [skip ci]'
          git push origin HEAD:main
