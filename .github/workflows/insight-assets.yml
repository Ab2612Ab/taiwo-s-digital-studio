name: Generate local Insight photo assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools and browser
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq python3 chromium-browser

      - name: Generate and validate eight local photographs
        env:
          GENERATOR_BASE_URL: https://insight-asset-generator-4mqj7q.v2.appdeploy.ai
        run: |
          set -euo pipefail
          assets=(business-website design-mistakes mobile-first performance ux-conversion building-website trust process)
          rm -f /tmp/insight-hashes.txt
          for asset in "${assets[@]}"; do
            echo "Generating ${asset}"
            chromium-browser --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=60000 --dump-dom \
              "${GENERATOR_BASE_URL}/?asset=${asset}&cacheBust=${GITHUB_SHA}" > "/tmp/${asset}.html"
            python3 - "${asset}" <<'PY'
import html
import json
import pathlib
import sys
asset = sys.argv[1]
source = pathlib.Path(f'/tmp/{asset}.html').read_text(encoding='utf-8', errors='replace')
start = source.find('<pre id="payload">')
end = source.find('</pre>', start)
if start < 0 or end < 0:
    raise SystemExit(f'generator payload not found: {asset}')
payload = html.unescape(source[start + len('<pre id="payload">'):end])
json.loads(payload)
pathlib.Path(f'/tmp/{asset}.json').write_text(payload, encoding='utf-8')
PY
            jq -e '.mimeType and (.bytes > 0) and .data' "/tmp/${asset}.json" >/dev/null
            jq -r '.data' "/tmp/${asset}.json" | base64 --decode > "/tmp/${asset}.source"
            identify "/tmp/${asset}.source"
            convert "/tmp/${asset}.source" -auto-orient -resize '1600x900^' -gravity center -extent 1600x900 -strip -quality 88 "src/assets/insights/${asset}.webp"
            identify -format '%w %h\n' "src/assets/insights/${asset}.webp" | awk '{if ($1 < 800 || $2 < 450) exit 1}'
            test -s "src/assets/insights/${asset}.webp"
            sha256sum "src/assets/insights/${asset}.webp" | cut -d ' ' -f1 >> /tmp/insight-hashes.txt
          done
          test "$(sort -u /tmp/insight-hashes.txt | wc -l)" -eq 8

      - name: Verify local imports and no external image sources
        run: |
          set -euo pipefail
          for asset in business-website design-mistakes mobile-first performance ux-conversion building-website trust process; do
            grep -q "@/assets/insights/${asset}.webp" src/routes/insights.tsx
            test -s "src/assets/insights/${asset}.webp"
          done
          ! grep -Eq '@?/assets/insights/[^"[:space:]]+\.svg' src/routes/insights.tsx
          ! grep -Eiq 'data:image|base64|https?://' src/routes/insights.tsx

      - name: Commit local Insight photographs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/insights/*.webp
          if git diff --cached --quiet; then
            echo 'No image changes.'
            exit 0
          fi
          git commit -m 'Replace Insight illustrations with local photographs [skip ci]'
          git push
