name: Generate local Insight photographs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-insight-photographs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-insight-photographs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install image validation/conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq chromium-browser || sudo apt-get install -y imagemagick jq chromium

      - name: Generate eight genuine local photographs
        env:
          GENERATOR_BASE_URL: https://insight-asset-generator-4mqj7q.v2.appdeploy.ai
        run: |
          set -euo pipefail
          assets=(business-website design-mistakes mobile-first performance ux-conversion building-website trust process)
          for asset in "${assets[@]}"; do
            echo "Generating ${asset} through the AppDeploy image-generation capability..."
            chromium --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=180000 --dump-dom "${GENERATOR_BASE_URL}/?asset=${asset}" > "/tmp/${asset}.html"
            python3 - "${asset}" <<'PY'
          import html
          import json
          import re
          import sys
          from pathlib import Path
          asset = sys.argv[1]
          text = Path(f'/tmp/{asset}.html').read_text(errors='replace')
          match = re.search(r'<pre[^>]*id=["\']payload["\'][^>]*>(.*?)</pre>', text, re.S)
          if not match:
              raise SystemExit(f'No payload returned for {asset}')
          payload = html.unescape(match.group(1))
          data = json.loads(payload)
          if not data.get('data') or not data.get('mimeType') or int(data.get('bytes', 0)) <= 0:
              raise SystemExit(f'Invalid generated image response for {asset}')
          Path(f'/tmp/{asset}.json').write_text(json.dumps(data))
          PY
            mime="$(jq -r '.mimeType' "/tmp/${asset}.json")"
            bytes="$(jq -r '.bytes' "/tmp/${asset}.json")"
            test -n "${mime}" && test "${mime}" != "null"
            test "${bytes}" -gt 0
            jq -r '.data' "/tmp/${asset}.json" | base64 --decode > "/tmp/${asset}.generated"
            test -s "/tmp/${asset}.generated"
            identify "/tmp/${asset}.generated"
            convert "/tmp/${asset}.generated" -strip -quality 88 "src/assets/insights/${asset}.webp"
            identify "src/assets/insights/${asset}.webp"
            test -s "src/assets/insights/${asset}.webp"
          done

      - name: Replace Insights imports with local photographs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/insights.tsx')
          text = path.read_text()
          names = ['business-website', 'design-mistakes', 'mobile-first', 'performance', 'ux-conversion', 'building-website', 'trust', 'process']
          for name in names:
              text = text.replace(f'@/assets/insights/{name}.svg', f'@/assets/insights/{name}.webp')
          path.write_text(text)
          PY

      - name: Verify local assets and production build
        run: |
          set -euo pipefail
          assets=(business-website design-mistakes mobile-first performance ux-conversion building-website trust process)
          for asset in "${assets[@]}"; do
            test -f "src/assets/insights/${asset}.webp"
            test -s "src/assets/insights/${asset}.webp"
            identify "src/assets/insights/${asset}.webp"
          done
          grep -q 'business-website.webp' src/routes/insights.tsx
          grep -q 'process.webp' src/routes/insights.tsx
          if grep -q '@/assets/insights/.*\.svg' src/routes/insights.tsx; then
            echo 'Old SVG Insight imports remain.'
            exit 1
          fi
          npm ci
          npm run build

      - name: Commit generated local assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/insights/*.webp src/routes/insights.tsx
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'Add local Insight photographs [skip ci]'
          git push
