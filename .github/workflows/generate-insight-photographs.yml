name: Generate local Insight photographs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-insight-photographs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-insight-photographs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install image validation/conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq

      - name: Generate eight genuine local photographs
        env:
          GENERATOR_BASE_URL: https://insight-asset-generator-4mqj7q.v2.appdeploy.ai
        run: |
          set -euo pipefail
          mkdir -p src/assets/insights/generated
          assets=(business-website design-mistakes mobile-first performance ux-conversion building-website trust process)
          for asset in "${assets[@]}"; do
            echo "Generating ${asset}..."
            curl --fail --silent --show-error --retry 3 "${GENERATOR_BASE_URL}/api/generate/${asset}" -o "/tmp/${asset}.json"
            mime="$(jq -r '.mimeType' "/tmp/${asset}.json")"
            bytes="$(jq -r '.bytes' "/tmp/${asset}.json")"
            test -n "${mime}" && test "${mime}" != "null"
            test "${bytes}" -gt 0
            jq -r '.data' "/tmp/${asset}.json" | base64 --decode > "/tmp/${asset}.generated"
            test -s "/tmp/${asset}.generated"
            magick identify "/tmp/${asset}.generated"
            magick "/tmp/${asset}.generated" -strip -quality 88 "src/assets/insights/${asset}.webp"
            magick identify "src/assets/insights/${asset}.webp"
            test -s "src/assets/insights/${asset}.webp"
          done

      - name: Replace Insights imports with local photographs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/insights.tsx')
          text = path.read_text()
          names = ['business-website', 'design-mistakes', 'mobile-first', 'performance', 'ux-conversion', 'building-website', 'trust', 'process']
          for name in names:
              text = text.replace(f'@/assets/insights/{name}.svg', f'@/assets/insights/{name}.webp')
          path.write_text(text)
          PY

      - name: Verify local assets and production build
        run: |
          set -euo pipefail
          assets=(business-website design-mistakes mobile-first performance ux-conversion building-website trust process)
          for asset in "${assets[@]}"; do
            test -f "src/assets/insights/${asset}.webp"
            test -s "src/assets/insights/${asset}.webp"
            magick identify "src/assets/insights/${asset}.webp"
          done
          grep -q 'business-website.webp' src/routes/insights.tsx
          grep -q 'process.webp' src/routes/insights.tsx
          if grep -q '@/assets/insights/.*\.svg' src/routes/insights.tsx; then
            echo 'Old SVG Insight imports remain.'
            exit 1
          fi
          npm ci
          npm run build

      - name: Commit generated local assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/insights/*.webp src/routes/insights.tsx
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'Add local Insight photographs [skip ci]'
          git push
