name: Generate and verify local Insight photographs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-insight-photographs.yml'
      - 'src/routes/insights.tsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image tools and browser
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq python3 chromium-browser
          npm install --no-save playwright

      - name: Generate eight genuine local Insight photographs
        env:
          GENERATOR_BASE_URL: https://insight-asset-generator-4mqj7q.v2.appdeploy.ai
        run: |
          set -euo pipefail
          assets=(business-website design-mistakes mobile-first performance ux-conversion building-website trust process)
          rm -f /tmp/insight-hashes.txt
          for asset in "${assets[@]}"; do
            echo "Generating ${asset}..."
            node - "${asset}" "${GENERATOR_BASE_URL}" <<'NODE'
const { chromium } = require('playwright');
const fs = require('fs');
const asset = process.argv[2];
const baseUrl = process.argv[3];
(async () => {
  const browser = await chromium.launch({ headless: true, executablePath: '/snap/bin/chromium', args: ['--no-sandbox', '--disable-dev-shm-usage'] });
  const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
  await page.goto(`${baseUrl}/?asset=${encodeURIComponent(asset)}&cacheBust=${process.env.GITHUB_SHA}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
  await page.waitForFunction(() => {
    const payload = document.querySelector('#payload');
    return Boolean(payload && payload.textContent && payload.textContent.trim().length > 0);
  }, { timeout: 180000 });
  const payload = await page.locator('#payload').textContent();
  if (!payload) throw new Error(`Empty generator payload for ${asset}`);
  fs.writeFileSync(`/tmp/${asset}.json`, payload, 'utf8');
  const parsed = JSON.parse(payload);
  if (parsed.error || !parsed.data || !parsed.mimeType) throw new Error(`Generator failed for ${asset}: ${JSON.stringify(parsed).slice(0, 500)}`);
  await browser.close();
})().catch(async (error) => { console.error(error); process.exit(1); });
NODE
            jq -e '.mimeType and (.bytes > 0) and .data' "/tmp/${asset}.json" >/dev/null
            jq -r '.data' "/tmp/${asset}.json" | base64 --decode > "/tmp/${asset}.source"
            identify "/tmp/${asset}.source"
            convert "/tmp/${asset}.source" -auto-orient -resize '1600x900^' -gravity center -extent 1600x900 -strip -quality 88 "src/assets/insights/${asset}.webp"
            identify -format '%w %h\n' "src/assets/insights/${asset}.webp" | awk '{if ($1 < 800 || $2 < 450) exit 1}'
            test -s "src/assets/insights/${asset}.webp"
            sha256sum "src/assets/insights/${asset}.webp" | cut -d ' ' -f1 >> /tmp/insight-hashes.txt
          done
          test "$(sort -u /tmp/insight-hashes.txt | wc -l)" -eq 8

      - name: Verify local Insight imports
        run: |
          set -euo pipefail
          for asset in business-website design-mistakes mobile-first performance ux-conversion building-website trust process; do
            grep -q "@/assets/insights/${asset}.webp" src/routes/insights.tsx
            test -s "src/assets/insights/${asset}.webp"
          done
          if grep -Eq 'assets/insights/[^"[:space:]]+\.svg' src/routes/insights.tsx; then exit 1; fi
          if grep -Eiq 'data:image|base64|https?://' src/routes/insights.tsx; then exit 1; fi

      - name: Format source without changing runtime content
        run: npx prettier --write src

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Commit verified fixes and local photographs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows/generate-insight-photographs.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix portfolio verification and add local Insight photographs [skip ci]'
          git push
